# settings.toml — noknok brain configuration (CircuitPython reads this file
# natively; the noknok code reads it with os.getenv()). This is THE place the
# brain learns its wiring. Never edit noknok.py or code.py for these.
#
# PINS HAVE NO DEFAULT IN THE CODE (DEV-74). A pin group that is missing here is
# OFF, and the brain says so (console, event history in the app, the Pico's own
# LED blinking at boot). If this file is lost entirely, the brain falls back to
# the last pins it saw here and asks you to restore the file.
#
# The values below are the noknok PicoHub (MOD-0011), the reference carrier.
# Change them only for a Pico you wired yourself.

# ── I2C bus A (JST SH 4-pin / Qwiic / Stemma QT modules) ─────────────────────
# PicoHub: ports J3 + J4 (and the hub's power manager).
NOKNOK_I2C_SDA = "GP10"
NOKNOK_I2C_SCL = "GP11"

# ── I2C bus B (optional; delete both lines for a single-bus brain) ───────────
# PicoHub: ports J5 + J6. Must use the OTHER I2C peripheral than bus A
# (GP10/11 = I2C1, GP20/21 = I2C0).
NOKNOK_I2C_B_SDA = "GP20"
NOKNOK_I2C_B_SCL = "GP21"

# Both buses run at this speed.
NOKNOK_I2C_FREQ = 100000

# ── USB host port (PIO-USB, for USB-C modules; optional) ─────────────────────
# PicoHub: the USB host port. D+ must be the lower GPIO number of a
# consecutive pair.
NOKNOK_USB_DP = "GP0"
NOKNOK_USB_DM = "GP1"

# ── Network name (DEV-70) ────────────────────────────────────────────────────
# 1 = the brain announces itself as noknok-XXXX.local on the home WiFi (default).
# 0 = off: the app finds the brain by scanning the network instead.
NOKNOK_MDNS = 1

# ── CIRCUITPY drive visibility (DEV-18) ──────────────────────────────────────
# 0 = hidden from PCs; the program may save settings (shipped default).
# 1 = visible; a PC may edit files, the program cannot write (maker/bench).
# Read by boot.py at power-up. From the REPL: noknok.set_usb_drive(True).
NOKNOK_USB_DRIVE = 0
